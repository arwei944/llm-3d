<style>

  .act{font-size:12px;color:var(--jade2);letter-spacing:1px;padding:10px 8px 4px;font-weight:600}
  .ch{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;

<script>
var LINES = [{"a":0,"z":5262,"text":"大语言模型的内部，到底在算什么？"},{"a":5292,"z":12570,"text":"接下来，我们把它从原理到训练，一步步拆开看。"},{"a":12600,"z":21010,"text":"模型看不懂文字。第一步是把文字切成 token —— 每个 token 对应一个整数 id。"},{"a":21040,"z":28184,"text":"例子输入 \"1592\"，被切成 4 个 token：1、5、9、2。"},{"a":28214,"z":33670,"text":"整个词表只有 12 个符号；真实的模型词表有几万到十几万个。"},{"a":33700,"z":42790,"text":"拿 id 去查一张表 E，得到一个 32 维的向量。"},{"a":42820,"z":50542,"text":"这张表是训练出来的：语义相近的 token，向量也会比较接近。"},{"a":50572,"z":56470,"text":"每一行代表一个 token 的初始含义，32 个数字就是它在空间里的坐标。"},{"a":56500,"z":63230,"text":"注意力本身是「无序」的：只给 token，模型分不清 \"1592\" 和 \"2915\"。"},{"a":63260,"z":68976,"text":"RoPE 把位置信息「旋转」进 Q 和 K —— 第 t 个位置转 t 个角度。"},{"a":69006,"z":73370,"text":"这样两个 token 的内积就自然带上了「相对距离」的信息。"},{"a":73400,"z":82224,"text":"Transformer 由若干层堆叠而成，这里用了 2 层。"},{"a":82254,"z":90612,"text":"每层干两件事：先让 token 之间交换信息（注意力），再各自做一次非线性加工（MLP）。"},{"a":90642,"z":96670,"text":"两件事外面都套了残差连接，前面还有 RMSNorm 负责稳定数值。"},{"a":96700,"z":102718,"text":"每层开始前先归一化：除以均方根，再乘一个可学习的增益 g。"},{"a":102748,"z":109270,"text":"不做这一步，数值会在层与层之间越滚越大，训练根本稳不住。"},{"a":109300,"z":115498,"text":"每个 token 的向量乘上三个权重矩阵，得到 Q、K、V。"},{"a":115528,"z":121380,"text":"Q 是「我在找什么」，K 是「我是什么」，V 是「我能提供什么」。"},{"a":121410,"z":126570,"text":"注意力就是用 Q 去匹配所有 K，再按匹配度加权取 V。"},{"a":126600,"z":132690,"text":"把 Q 和 K 做内积、除以 √d_h 缩放，得到一张分数表。"},{"a":132720,"z":138810,"text":"再用下三角掩码把「未来」遮掉 —— 这就是因果注意力，只能看已生成的部分。"},{"a":138840,"z":143570,"text":"最后 softmax 成概率，每一行加起来正好等于 1。"},{"a":143600,"z":150676,"text":"格子越深，说明这个位置的 token 被「关注」得越多。"},{"a":150706,"z":157034,"text":"形状是三角的，因为每个位置只能看到自己和前面的位置。"},{"a":157064,"z":162270,"text":"这些数字不是画出来的 —— 它们来自刚才那次真实的前向计算。"},{"a":162300,"z":169910,"text":"用概率给所有 V 加权求和，得到注意力这一路的输出。"},{"a":169940,"z":176022,"text":"然后把输出加回原来的 x —— 这就是残差连接。"},{"a":176052,"z":181370,"text":"残差让梯度能直接流回浅层，是深层网络能训起来的关键。"},{"a":181400,"z":189770,"text":"把 32 维升到 64 维，过一层 GELU 激活，再降回 32 维。"},{"a":189800,"z":196490,"text":"这里没有任何 token 之间的交流 —— 它是逐位置独立进行的。"},{"a":196520,"z":202370,"text":"一句话总结：注意力负责横向传信息，MLP 负责纵向做加工。"},{"a":202400,"z":209048,"text":"每个球是一个隐层神经元，大小和颜色是它这次的真实激活值。"},{"a":209078,"z":213818,"text":"可以看到只有一部分神经元被点亮 —— 这就是稀疏激活。"},{"a":213848,"z":218270,"text":"大模型里这个隐层要宽得多，但原理完全相同。"},{"a":218300,"z":223948,"text":"第 1 层输出后，第 2 层用完全相同的结构再算一遍。"},{"a":223978,"z":229960,"text":"真实的模型会堆几十到上百层，每一层的流程都和我们刚看到的一样。"},{"a":229990,"z":234970,"text":"到这里，25 个原子步骤里的前 20 步已经走完。"},{"a":235000,"z":241250,"text":"最后再做一次 RMSNorm，然后乘上输出矩阵 W_lm。"},{"a":241280,"z":246588,"text":"它把 32 维的向量，投影成词表大小 12 的「打分」—— logits。"},{"a":246618,"z":250670,"text":"分数越高，模型越认为下一个 token 是它。"},{"a":250700,"z":258524,"text":"softmax 把 logits 变成概率分布：全部非负，加起来等于 1。"},{"a":258554,"z":264508,"text":"温度 T 控制分布的「陡峭程度」—— T 越小越保守，越大越随机。"},{"a":264538,"z":269370,"text":"到这里，模型才第一次给出「下一个词可能是谁」的答案。"},{"a":269400,"z":275944,"text":"Top-p 按概率从高到低累加，累计超过阈值就把剩下的截断。"},{"a":275974,"z":282172,"text":"在保留下来的候选里按概率随机抽一个 —— 所以同样的输入，输出可以不同。"},{"a":282202,"z":286670,"text":"抽出的 token 就是这次的预测结果。"},{"a":286700,"z":295448,"text":"把刚生成的 token 追加到序列末尾，然后整段重新跑一遍。"},{"a":295478,"z":302136,"text":"这就是「自回归」—— 一次生成一个 token，循环下去，直到结束符。"},{"a":302166,"z":307570,"text":"所谓大模型写字，本质就是这个循环重复了几百上千次。"},{"a":307600,"z":317838,"text":"刚才看到的每个数字，都来自浏览器里这次真实的前向计算。"},{"a":317868,"z":328710,"text":"以固定输入 \"1592\" 为例：Embedding 查表、RMSNorm、QKV、注意力分数、softmax、MLP 激活、logits —— 逐步摊开。"},{"a":328740,"z":337770,"text":"其中注意力那一组最能说明问题：先算原始分数，再减最大值，再归一化。"},{"a":337800,"z":345636,"text":"同一套权重，命令行里的另一份独立实现（同样用 Node 跑）算出的参考值，与页面逐项比对。"},{"a":345666,"z":353088,"text":"13 组张量，最大绝对误差 0 —— 说明页面上的数确实是算出来的，不是写死的。"},{"a":353118,"z":358470,"text":"面板上那两行自检，就是每次刷新都现场跑一遍这个比对。"},{"a":358500,"z":364986,"text":"到这里模型还是「随机」的 —— 它的权重是随机初始化的。"},{"a":365016,"z":371502,"text":"训练做的事很朴素：让它预测下一个 token，猜错了就调整权重，然后重复。"},{"a":371532,"z":376570,"text":"接下来看这个闭环的每一步。"},{"a":376600,"z":384974,"text":"从语料里切一个窗口：上面一行是输入 x，下面一行是目标 y。"},{"a":385004,"z":391086,"text":"y 就是 x 往左移一格 —— 「下一个 token」这个监督信号直接来自序列本身。"},{"a":391116,"z":395670,"text":"所以不需要人工标注，任何文本都是训练数据。"},{"a":395700,"z":402120,"text":"和推理时完全相同的计算路径：嵌入、注意力、MLP、输出头。"},{"a":402150,"z":408570,"text":"训练和推理共用同一条前向路径，区别只在训练时我们记住了中间结果。"},{"a":408600,"z":416084,"text":"把正确 token 的概率取负对数，就是这一回的损失。"},{"a":416114,"z":424040,"text":"概率越接近 1，损失越接近 0；随机初始化的模型大约在 ln(12) ≈ 2.48 附近。"},{"a":424070,"z":430670,"text":"一个数字就概括了「这次猜得有多离谱」，接下来要让它变小。"},{"a":430700,"z":437422,"text":"要对权重负责，就得知道每个权重把损失推高了多少 —— 这就是梯度。"},{"a":437452,"z":445018,"text":"从损失出发，用链式法则一层层往回算。柱子的高度就是各块参数真实的梯度范数。"},{"a":445048,"z":451770,"text":"这个过程是手写的：前向、反向、每一层的转置乘法，都在 model.js 里。"},{"a":451800,"z":460142,"text":"如果梯度整体太大，一次更新就可能把模型推飞。"},{"a":460172,"z":465602,"text":"做法很简单：梯度范数超过阈值，就整体等比缩放回去。"},{"a":465632,"z":469970,"text":"画面上的 ‖g‖ 和裁剪系数，都是这一步的真实值。"},{"a":470000,"z":477382,"text":"AdamW 用两个统计量来决定每一步走多大：梯度的滑动平均，和梯度平方的滑动平均。"},{"a":477412,"z":484794,"text":"前者提供惯性，后者让每个参数有各自的学习率；再额外做一点权重衰减。"},{"a":484824,"z":491770,"text":"画面上的立方体就是 W₁ 的真实权重，橙色小块是真实的一阶矩（动量）。"},{"a":491800,"z":499636,"text":"一次迭代结束，权重已经变了。回到第一步，换一个批次再来。"},{"a":499666,"z":506674,"text":"这条曲线是真实跑出来的 loss：每完成一次迭代就记录一个点。"},{"a":506704,"z":512470,"text":"训练就是把这个闭环重复成千上万次 —— 大模型要跑几百万次。"},{"a":512500,"z":522508,"text":"原理、推理、训练 —— 三者用的是同一套代码、同一份权重、同一套数学。"},{"a":522538,"z":531112,"text":"语料是六个三字符词拼成的短语；模型从随机初始化出发，真把下一字符的预测准确率练到了八成以上。"},{"a":531142,"z":536400,"text":"大模型的规模大了几个数量级，但骨架就是刚才这些。"}];

function fmt(s){ s = Math.max(0, Math.round(s||0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

var v = document.getElementById('v'), sub = document.getElementById('sub'),
    pp = document.getElementById('pp'), seek = document.getElementById('seek'),
    clock = document.getElementById('clock'), sp = document.getElementById('sp');
var SPEEDS = [1, 1.25, 1.5, 2, 0.75], si = 0;

function setPP() { pp.textContent = v.paused ? '▶ 播放' : '⏸ 暂停'; pp.classList.toggle('on', !v.paused); }
pp.onclick = function () { v.paused ? v.play() : v.pause(); };
document.getElementById('b10').onclick = function () { v.currentTime = Math.max(0, v.currentTime - 10); };
document.getElementById('f10').onclick = function () { v.currentTime = Math.min(v.duration, v.currentTime + 10); };
sp.onclick = function () { si = (si + 1) % SPEEDS.length; v.playbackRate = SPEEDS[si]; sp.textContent = SPEEDS[si].toFixed(2).replace(/\.?0+$/, '') + '×'; };
document.getElementById('fs').onclick = function () {
  var st = document.querySelector('.stage');
  if (document.fullscreenElement) document.exitFullscreen(); else st.requestFullscreen && st.requestFullscreen();
};
seek.addEventListener('input', function () { v.currentTime = seek.value / 1000; });
function tick() {
  if (!seek.matches(':active')) seek.value = Math.round(v.currentTime * 1000);
  clock.textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration || 0);
  // 字幕
  var t = v.currentTime * 1000, hit = null;
  for (var i = 0; i < LINES.length; i++) { if (t >= LINES[i].a && t < LINES[i].z) { hit = LINES[i]; break; } }
  sub.textContent = hit ? hit.text : '';
  // 高亮当前章节
  var cur = 0;
  for (var k = 0; k < CHAPTERS.length; k++) { if (t / 1000 >= CHAPTERS[k].t) cur = k; }
  var bs = document.querySelectorAll('.ch');
  for (var j = 0; j < bs.length; j++) bs[j].classList.toggle('on', +bs[j].dataset.i === cur);
}
/* timeupdate 在暂停/程序化 seek 时不一定触发，所以再加一个 250ms 的兜底轮询 */
v.addEventListener('timeupdate', tick);
setInterval(tick, 250); tick();
v.addEventListener('play', setPP); v.addEventListener('pause', setPP); setPP();

var toc = document.getElementById('toc');
toc.addEventListener('click', function (e) {
  var b = e.target.closest('.ch'); if (!b) return;
  v.currentTime = +b.dataset.t; v.play();
});
document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if (e.code === 'ArrowLeft') v.currentTime = Math.max(0, v.currentTime - 10);
  else if (e.code === 'ArrowRight') v.currentTime = Math.min(v.duration, v.currentTime + 10);
  else if (e.key === 'f' || e.key === 'F') document.getElementById('fs').click();
  else if (e.key === 's' || e.key === 'S') sp.click();
});
</script>
